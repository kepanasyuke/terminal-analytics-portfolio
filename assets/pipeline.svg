<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Как устроен каждый проект"><title>Как устроен каждый проект</title><rect width="900" height="220" rx="16" fill="#f6f8fb"/><text x="24" y="34" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="17" font-weight="600" fill="#111f38">Как устроен каждый проект</text><text x="24" y="55" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#6a7a92">синтетические данные с эталоном → расчёты на SQL или Python → метрики → отчёт и тесты</text><path id="flow" d="M 126.0 133.0 L 858 133.0" fill="none" stroke="none"/><rect x="40" y="96" width="172" height="74" rx="12" fill="#ffffff" stroke="#e3e9f3"/><text x="126.0" y="128" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#111f38">Данные</text><text x="126.0" y="148" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#6a7a92">генератор с эталоном</text><rect x="262" y="96" width="172" height="74" rx="12" fill="#ffffff" stroke="#e3e9f3"/><text x="348.0" y="128" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#111f38">Расчёт</text><text x="348.0" y="148" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#6a7a92">SQL · Python</text><rect x="484" y="96" width="172" height="74" rx="12" fill="#ffffff" stroke="#e3e9f3"/><text x="570.0" y="128" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#111f38">Метрики</text><text x="570.0" y="148" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#6a7a92">витрины и пороги</text><rect x="706" y="96" width="172" height="74" rx="12" fill="#ffffff" stroke="#e3e9f3"/><text x="792.0" y="128" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="14" font-weight="600" fill="#111f38">Отчёт</text><text x="792.0" y="148" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="11" fill="#6a7a92">HTML · CSV · тесты</text><path d="M 218 133.0 l 30 0" stroke="#6a7a92" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 440 133.0 l 30 0" stroke="#6a7a92" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 662 133.0 l 30 0" stroke="#6a7a92" stroke-width="1.6" marker-end="url(#arrow)"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a7a92"/></marker></defs><circle r="5" fill="#2563eb" opacity="0.85"><animateMotion dur="3.6s" begin="0.0s" repeatCount="indefinite" fill="freeze"><mpath href="#flow"/></animateMotion></circle><circle r="5" fill="#2563eb" opacity="0.85"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite" fill="freeze"><mpath href="#flow"/></animateMotion></circle><circle r="5" fill="#2563eb" opacity="0.85"><animateMotion dur="3.6s" begin="2.4s" repeatCount="indefinite" fill="freeze"><mpath href="#flow"/></animateMotion></circle><text x="450.0" y="194" text-anchor="middle" font-family="'Segoe UI',Roboto,Arial,sans-serif" font-size="12" fill="#6a7a92">четыре проекта — 46 тестов на эталонных данных</text></svg>